[package]
name = "meetbutler-engine"
description = "Local meeting transcription engine: Silero speech spans, whisper.cpp decoding, on-disk audio and SQLite transcripts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
log = "0.4.34"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"

[dev-dependencies]
serde_json = "1"
tempfile = "3.27.0"
