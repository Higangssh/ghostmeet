<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MeetButler</title>
  <link rel="stylesheet" href="style.css">
  <script src="common.js" defer></script>
  <script src="main.js" defer></script>
</head>
<body class="bar">
  <div class="bar-row">
    <div id="indicator" class="indicator" hidden>
      <span class="dot" aria-hidden="true"></span><span>녹음 중</span>
      <span id="elapsed" class="elapsed">0:00</span>
    </div>
    <span id="idle-title" class="bar-title">MeetButler</span>
    <span id="sources" class="chips"></span>
    <span class="spacer"></span>
    <button id="toggle" class="toggle small" type="button">녹음 시작</button>
    <button id="expand" class="icon" type="button" title="패널 펼치기" aria-label="패널 펼치기">▢</button>
    <button id="library" class="icon" type="button" title="라이브러리" aria-label="라이브러리">☰</button>
  </div>
  <p id="last" class="last-line" aria-live="polite"></p>
</body>
</html>
