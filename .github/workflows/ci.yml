# The default test tier on macOS and Windows: no model, no network beyond fetching
# crates, no secrets. Models, the slow tier and the GUI checks stay on a real Mac
# (CLAUDE.md, app/README.md). Actions are pinned to commits; only actions/* and
# dtolnay/rust-toolchain are used.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: macos-cargo-
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --features meetbutler-engine/whisper,meetbutler-engine/silero -- -D warnings
      - run: cargo test --workspace
      - name: bench tests (Python, standard library only)
        run: python3 -I -m unittest discover -s bench/tests -t bench

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-cargo-
      - run: cargo build --workspace
      - run: cargo test --workspace
      # the Windows-only code (system audio, when it lands) must not rot unseen
      - run: cargo clippy -p meetbutler-audio --all-targets -- -D warnings
